<!DOCTYPE html>
<html lang="en">
<head>
        <title>DOM</title>
        <style>
          .js-btn{
            background-color: black;
            color: aliceblue;
            height: 30px;
            width: 100px;
            padding: 6px 8px;
            border-radius: 25px;
          }
          .js-btn :hover{
            motion: 12px;
          }
          .cal{
            background-color: rgb(95, 206, 95) ;
            border-color: white;
            scrollbar-shadow-color:black;
          }
          </style>
</head>
<body>
    <p>Youtube subscribe button</p>
   <button onclick = "
    subscribe();
   "
   class="js-btn"
   
   >Subscribe</button>

   <p>Amazon Shipping Calculator</p>
    <input class="js-input" type="text" placeholder="cost of order" onkeydown = "
    Calculate(event)
    ">
    <button class = "cal" onclick="amazonShippingCalculator()" >Calculate</button>
    <p class = "js-amazon-cost"></p>

   <script>
    function Calculate(event){
        if(event.key === 'Enter'){
        amazonShippingCalculator()
    }
    }
    function amazonShippingCalculator() {
      const inputElement = document.querySelector('.js-input');
      let cost = Number(inputElement.value);
      console.log(cost);

      if(cost<100){
        cost = cost + 10;
      }
      console.log(cost);
      document.querySelector('.js-amazon-cost').innerHTML = `${cost}/-`;
    }
        

    function subscribe() {
      const buttonElement = document.querySelector('.js-btn');

      if (buttonElement.innerText === 'Subscribe') {
        buttonElement.innerText = 'Subscribed';
      } else {
        buttonElement.innerText = 'Subscribe';
      }
    }
   </script>

</body>
</html>
