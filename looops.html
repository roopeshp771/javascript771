<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loops.js</title>
</head>
<body>
    <script>
        let i = 1;

        while(i <= 5){
            console.log(i);
            i++;
        
        }
        for(let i = 22;i<=30;i++){
            console.log(i)
        }

        let num = 0 ;
        while(num < 0.5){
            num = Math.random();
            
        }
        console.log(num);
        
        const myArray = ["html","css","js"];
        for(let i = 0; i<=myArray.length - 1; i++){
            let item = myArray[i];
            console.log(item);
        } 
        
        const myArray1 = [1,5,10];
        let total = 0;
        for(let i = 0; i <= myArray1.length - 1; i++){
            const item1 = myArray1[i];
            total =total+item1;
            
        }
        console.log(total);
        
        const myArray2 = [1,2,3];
        const AfArray = [];
        for(let i = 0; i < myArray2.length;i++){
            AfArray[i] = myArray2[i] * 2;
        }
        console.log(AfArray);
        </script>
</body>
</html>
