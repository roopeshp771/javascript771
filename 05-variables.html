<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
</head>
<body>
    <script>
        let variable1 = 5;
        console.log(variable1);
        console.log(variable1+15);
        let result = variable1*3;
        console.log(result);
        let d = "demo"
        console.log(d);
        let details = d+11+d;
        console.log(details)
        variable1 = 10;
        console.log(variable1+55);
        const variable2 = 30 ;
        console.log(variable2);

        var variable3 = 40;
        console.log(variable3);
        let name = "Roopesh";
        console.log(`My name is: ${name}`);
        let cost = 50+(30*2)+90;
        console.log(cost);
        console.log(`Cost of food: ${cost}`);
        let tax = cost%0.1;
        console.log(`The tax of food: $${tax}`);
    </script>
</body>
</html>
