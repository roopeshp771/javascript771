<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>
<body>
    <button
    onclick = "
    console.log(`Cart Quantity: ${quantity}`);">
    Show Quantity</button>
    <button onclick = "
    quantity ++;
    console.log(`Cart Quantity: ${quantity}`);">Add to Cart</button>
    <button onclick = "
    quantity += 2;
    console.log(`Cart Quantity: ${quantity}`)">+2</button>
    <button onclick ="
    quantity += 3;
    console.log(`Cart Quantity: ${quantity}`)">+3</button>
    <button onclick = "
    console.log('Cast was reset');
    quantity = 0;
    console.log(`Cart Quantity: ${quantity}`);">Reset Cart</button>
    <script>
        let quantity = 10;
    </script>
</body>
</html>
