<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML CSS JS TOGETHER</title>
    <style>
        .btn{
            background-color: aqua;
            color:black;
            padding: 20px 40px;
            border-radius: 5px;
            font-size:16px;
            font-weight: 700;
        }
        .boat{
            background-color: red;
            color: white;
            padding: 5px 40px;
            font-size: 15px;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <button class="boat" onclick="alert('SUBSCRIBED')">SUBSCRIBE</button>
    <button class="btn" onclick="alert('Good job')">Click me</button>
    <script>
        console.log(2+3);
        console.log('hello'+'world');
        console.log('roopesh'+11+'2006');
        
    </script>
</body>
</html>
